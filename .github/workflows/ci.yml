name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore GiftList.slnx

      - run: dotnet build GiftList.slnx --configuration Release --no-restore

      - run: dotnet test GiftList.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # orval reads the OpenAPI doc this writes to src/GiftList.Api/obj/GiftList.Api.json,
      # so the API must be built before the frontend can generate its client.
      - run: dotnet build src/GiftList.Api --configuration Release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      - run: npm run build
        working-directory: client

      - run: npm run test
        working-directory: client
